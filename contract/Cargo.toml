[package]
name = "tollgate"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "On-chain spending policy vault for AI agents on NEAR: scoped function-call keys, per-agent limits, counterparty checks, human approval queue."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

